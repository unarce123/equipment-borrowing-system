{% extends 'base.html' %}

{% block content %}

<h1 class="text-2xl font-bold mb-6">Dashboard</h1>

<div class="grid grid-cols-4 gap-4">

    <div class="bg-white p-4 shadow rounded">
        <h2 class="text-gray-500">Total Equipment</h2>
        <p class="text-2xl font-bold">{{ total_equipment }}</p>
    </div>

    <div class="bg-white p-4 shadow rounded">
        <h2 class="text-gray-500">Available</h2>
        <p class="text-2xl font-bold">{{ available_equipment }}</p>
    </div>

    <div class="bg-white p-4 shadow rounded">
        <h2 class="text-gray-500">Pending Requests</h2>
        <p class="text-2xl font-bold">{{ pending_requests }}</p>
    </div>

    <div class="bg-white p-4 shadow rounded">
        <h2 class="text-gray-500">Approved</h2>
        <p class="text-2xl font-bold">{{ approved_requests }}</p>
    </div>

</div>

{% endblock %}
