{% extends 'base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-3xl shadow-lg p-8">

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Equipment Form
            </h1>

            <p class="text-gray-500 mt-2">
                Add or update equipment information.
            </p>
        </div>

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Equipment Name
                </label>
                {{ form.name }}
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Category
                </label>
                {{ form.category }}
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Quantity
                </label>
                {{ form.quantity }}
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Status
                </label>
                {{ form.status }}
            </div>

            <div>
                <label class="block mb-2 font-semibold text-gray-700">
                    Description
                </label>
                {{ form.description }}
            </div>

            <button
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl shadow transition w-full">
                Save Equipment
            </button>

        </form>

    </div>

</div>

{% endblock %}
