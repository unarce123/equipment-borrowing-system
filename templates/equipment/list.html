{% extends 'base.html' %}

{% block content %}

<h1 class="text-2xl font-bold mb-4">Equipment List</h1>

<!-- SEARCH BAR -->
<form method="GET" class="mb-4 flex gap-2">
    <input type="text"
           name="q"
           placeholder="Search equipment..."
           value="{{ query }}"
           class="border p-2 rounded w-1/3">

    <button class="bg-blue-500 text-white px-4 py-2 rounded">
        Search
    </button>
</form>

<!-- ADD BUTTON -->
<a href="/equipment/add/" class="bg-blue-500 text-white px-3 py-2 rounded inline-block mb-4">
    Add Equipment
</a>

<!-- TABLE CARD CONTAINER (IMPROVED UI) -->
<div class="bg-white shadow-lg rounded-lg p-4">

    <table class="w-full">

        <thead>
            <tr class="border-b text-left bg-gray-50">
                <th class="py-3">Name</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for item in items %}
            <tr class="border-b hover:bg-gray-100 transition">

                <td class="py-3 font-medium">{{ item.name }}</td>

                <td>{{ item.quantity }}</td>

                <td>
                    <span class="px-2 py-1 rounded text-white text-sm
                        {% if item.status == 'available' %} bg-green-500
                        {% elif item.status == 'borrowed' %} bg-yellow-500
                        {% else %} bg-red-500
                        {% endif %}">
                        {{ item.status }}
                    </span>
                </td>

                <td class="space-x-3">

                    <a href="/equipment/edit/{{ item.id }}/"
                       class="text-blue-600 hover:underline">
                        Edit
                    </a>

                    <a href="/equipment/delete/{{ item.id }}/"
                       class="text-red-500 hover:underline">
                        Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="4" class="text-center py-6 text-gray-500">
                    No equipment found
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
