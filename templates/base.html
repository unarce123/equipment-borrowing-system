<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Equipment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="flex">

    <!-- SIDEBAR -->
    <div class="w-64 bg-white h-screen shadow-md p-4">
        <h2 class="text-xl font-bold mb-6">System</h2>

        <a href="/dashboard/" class="block py-2">Dashboard</a>
        <a href="/equipment/" class="block py-2">Equipment</a>
        <a href="/borrow/" class="block py-2">Borrow Requests</a>

        <hr class="my-4">

        {% if user.is_authenticated %}
            <a href="/accounts/logout/" class="text-red-500">Logout</a>
        {% else %}
            <a href="/accounts/login/" class="text-blue-500">Login</a>
        {% endif %}
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-6">
        {% block content %}
        {% endblock %}
    </div>

</div>

<!-- MESSAGES -->
{% if messages %}
<div class="fixed top-5 right-5 space-y-2">
    {% for message in messages %}
        <div class="bg-green-500 text-white px-4 py-2 rounded shadow">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

</body>
</html>
