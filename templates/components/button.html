<a href="{{ url|default:'#' }}"
   class="inline-flex items-center px-4 py-2 rounded-xl font-medium transition

   {% if type == 'primary' %}
       bg-primary text-white hover:bg-secondary

   {% elif type == 'danger' %}
       bg-danger text-white hover:opacity-90

   {% elif type == 'ghost' %}
       bg-transparent text-dark hover:bg-accent border border-primary/20

   {% else %}
       bg-accent text-dark hover:bg-secondary
   {% endif %}
">
    {{ label }}
</a>
